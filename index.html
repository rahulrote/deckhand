<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Deckhand: create, edit and present slides in your browser. No build step, no database.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='19' rx='4' fill='none' stroke='%232b56e0' stroke-width='3'/%3E%3Crect x='8' y='18' width='16' height='3' rx='1.5' fill='%232b56e0'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Deckhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a home shelf of decks, and an editor with filmstrip | stage + notes, plus a fullscreen present overlay.
   Palette: cool paper greys with one ink-blue accent. Type: DM Sans UI, DM Mono for timer and keys. */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#1b2230; --ink2:#586375; --line:#d6dce5; --canvas:#dde2e9;
  --accent:#2b56e0; --accent-ink:#ffffff; --accent-soft:#e2e9ff; --danger:#c23b2e; --hover:#eef1f6;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 20px rgba(20,30,50,.10);
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161b; --panel:#1b1f26; --ink:#e7eaf0; --ink2:#99a4b5; --line:#2b323d; --canvas:#0f1215;
  --accent:#8aa5ff; --accent-ink:#0b1226; --accent-soft:#26304d; --danger:#ff7b6b; --hover:#252b35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --panel:#1b1f26; --ink:#e7eaf0; --ink2:#99a4b5; --line:#2b323d; --canvas:#0f1215;
  --accent:#8aa5ff; --accent-ink:#0b1226; --accent-soft:#26304d; --danger:#ff7b6b; --hover:#252b35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;position:relative}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5em;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled],.tb[disabled]{opacity:.38;pointer-events:none}
.tb{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border:0;border-radius:7px;background:transparent;font-weight:700}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.field{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 8px}
input[type=color]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
.cl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}

/* home */
#home{height:100%;overflow:auto;padding:0 clamp(16px,4vw,48px) 48px}
.home-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:28px 20px;max-width:1200px;margin:0 auto}
.brand{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:19px;border-radius:4px;border:2.5px solid var(--accent);display:block;position:relative}
.brand i::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:3px;background:var(--accent);border-radius:2px}
.home-note{max-width:1200px;margin:0 auto 16px;color:var(--ink2)}
.grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .pv{aspect-ratio:16/9;background:var(--canvas);cursor:pointer;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.card .meta{padding:10px 12px 8px;min-width:0}
.card .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:12px;color:var(--ink2)}
.card .acts{display:flex;gap:2px;padding:0 6px 8px 8px}
.card .acts button{border:0;background:transparent;color:var(--ink2);font-size:12px;padding:4px 7px;border-radius:6px}
.card .acts button:hover{background:var(--hover);color:var(--ink)}
.card .acts button.danger{color:var(--danger);font-weight:700}
.empty{max-width:1200px;margin:40px auto;color:var(--ink2)}

/* editor */
#editor{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .title{flex:1 1 160px;min-width:120px;max-width:380px;height:34px;border:1px solid transparent;border-radius:7px;background:transparent;font-size:16px;font-weight:700;padding:0 8px}
.top .title:hover{border-color:var(--line)}
.top .title:focus{border-color:var(--accent);background:var(--bg)}
.status{font-size:12px;color:var(--ink2);min-width:64px}
.grow{flex:1}
.split{display:inline-flex}
.split .btn:first-child{border-radius:8px 0 0 8px}
.split .btn:last-child{border-radius:0 8px 8px 0;padding:0 8px;border-left:1px solid rgba(255,255,255,.35)}
.tools{display:flex;align-items:center;gap:2px;padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.tools>*{flex:none}
#sizeIn{width:50px;text-align:center}
.main{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
#film{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
#filmList{flex:1;overflow-y:auto;padding:10px 10px 4px}
.th{position:relative;display:flex;gap:6px;padding:4px 2px;border-radius:8px;margin-bottom:2px;cursor:pointer}
.th .num{width:16px;font-size:11px;color:var(--ink2);text-align:right;padding-top:2px;font-variant-numeric:tabular-nums;flex:none}
.th .pv{width:160px;aspect-ratio:16/9;border:2px solid var(--line);border-radius:5px;overflow:hidden;position:relative;background:var(--canvas)}
.th.cur .pv{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.th.drop-b::after,.th.drop-a::before{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:2px}
.th.drop-b::after{bottom:-3px}.th.drop-a::before{top:-3px}
.th .mini{position:absolute;right:4px;top:6px;display:none;gap:2px}
.th:hover .mini,.th:focus-within .mini{display:flex}
.th .mini button{width:22px;height:22px;display:grid;place-items:center;padding:0;border-radius:5px;border:1px solid var(--line);background:var(--panel)}
.th .mini svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addrow{padding:8px 10px 10px}
.addrow .btn{width:100%;justify-content:center}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
#stageWrap{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--canvas);display:grid;place-items:center}
#stageBox{position:relative;box-shadow:var(--shadow);flex:none}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;touch-action:none}
.slide .el{cursor:move;user-select:none;-webkit-user-select:none}
.slide .el[contenteditable]{cursor:text;user-select:text;-webkit-user-select:text;outline:2px solid var(--accent)}
#sel{position:absolute;pointer-events:none;border:calc(2px*var(--u)) solid var(--accent)}
#sel .h{position:absolute;pointer-events:auto;width:calc(11px*var(--u));height:calc(11px*var(--u));margin:calc(-5.5px*var(--u));background:#fff;border:calc(1.6px*var(--u)) solid var(--accent);border-radius:calc(2px*var(--u))}
.h[data-h=nw]{left:0;top:0;cursor:nwse-resize}.h[data-h=n]{left:50%;top:0;cursor:ns-resize}.h[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.h[data-h=e]{left:100%;top:50%;cursor:ew-resize}.h[data-h=se]{left:100%;top:100%;cursor:nwse-resize}.h[data-h=s]{left:50%;top:100%;cursor:ns-resize}
.h[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.h[data-h=w]{left:0;top:50%;cursor:ew-resize}
.guide{position:absolute;background:#ff3d8b;pointer-events:none}
#notes{display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px 12px}
#notes label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
#notesIn{width:100%;height:76px;min-height:44px;max-height:240px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);line-height:1.45}
@media (max-width:760px){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #film{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  #filmList{display:flex;overflow-y:hidden;overflow-x:visible;padding:8px;gap:8px;flex:none}
  .th{margin:0;flex:none}.th .num{display:none}.th .pv{width:104px}
  .addrow{flex:none;padding:8px;align-self:center}.addrow .btn{width:auto}
}

/* popover + layout picker */
#pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:190px;max-width:calc(100vw - 16px)}
#pop .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px}
#pop .it:hover{background:var(--hover)}
#pop .it kbd{margin-left:auto;font:11px var(--mono);color:var(--ink2)}
#pop .it.danger{color:var(--danger)}
#pop .glyph{width:20px;text-align:center;font-size:16px;color:var(--ink2)}
.lay{display:grid;grid-template-columns:repeat(2,150px);gap:8px;padding:5px}
.lay button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;text-align:left}
.lay button:hover{border-color:var(--accent);background:var(--accent-soft)}
.lay .pv{aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:4px;border:1px solid var(--line);margin-bottom:5px}
.lay span{font-size:12px;font-weight:500}

/* present */
#present{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;color:#fff;cursor:default}
#pStage{flex:1;min-height:0;display:grid;place-items:center;position:relative;cursor:pointer}
#pBox{position:relative;flex:none}
#pBox>.slide{position:absolute;left:0;top:0;transform-origin:0 0}
#pNotes{height:30vh;background:#14171c;border-top:1px solid #2b323d;padding:12px clamp(16px,4vw,48px);overflow:auto;cursor:auto}
#pNotes h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8e99ab}
#pNotesTxt{font-size:clamp(16px,2.4vw,26px);line-height:1.45;white-space:pre-wrap;max-width:1000px}
#pNotesTxt.none{color:#6d7788;font-style:italic}
#pHud{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;align-items:center;gap:6px;background:rgba(20,22,28,.88);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 8px;transition:opacity .25s;backdrop-filter:blur(6px);z-index:2}
#pHud.hide{opacity:0;pointer-events:none}
#pHud button{height:32px;min-width:32px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:#fff;font-weight:500}
#pHud button:hover{background:rgba(255,255,255,.14)}
#pHud button.on{background:rgba(255,255,255,.22)}
#pHud .info{font:13px var(--mono);padding:0 8px;min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
#pHud .sp{width:1px;height:18px;background:rgba(255,255,255,.2)}
#pHud svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}


/* ai dialog */
#ai{position:fixed;inset:0;z-index:150;background:rgba(10,14,22,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(580px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg>*{flex:none}
.dlg h2{margin:0;font-size:18px;letter-spacing:-.01em}
.dlg .dh{display:flex;align-items:center;justify-content:space-between}
.dlg label{font-weight:500;font-size:13px}
.dlg textarea,.dlg input[type=text],.dlg input[type=password],.dlg input[type=number],.dlg select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px}
.dlg textarea{resize:vertical;line-height:1.45}
.dlg .row{display:grid;grid-template-columns:90px 1fr 1fr;gap:10px}
.dlg .row>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.dlg .chk{display:flex;align-items:center;gap:8px;font-weight:400}
.dlg .hint{font-size:12px;color:var(--ink2)}
.dlg .err{color:var(--danger);font-size:13px;font-weight:500}
.dlg .foot{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.dlg .foot span{margin-right:auto;font-size:12px;color:var(--ink2)}
.dlg details{border-top:1px solid var(--line);padding-top:10px}
.dlg summary{cursor:pointer;font-weight:500;font-size:13px}
.dlg details>*:not(summary){margin-top:8px}
@media (max-width:520px){.dlg .row{grid-template-columns:1fr 1fr}.dlg .row>div:first-child{grid-column:1/-1}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:500;z-index:200;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast.err{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <section id="home" hidden>
    <div class="home-top">
      <div class="brand"><i></i>Deckhand</div>
      <button class="btn" id="importBtn">Import JSON</button>
      <button class="btn" id="newAiBtn"><span data-ic="spark"></span>New with AI</button>
      <button class="btn primary" id="newDeckBtn">New presentation</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div class="home-note" id="homeNote" hidden></div>
    <div class="grid" id="deckGrid"></div>
  </section>

  <section id="editor" hidden>
    <div class="top">
      <button class="tb" id="homeBtn" title="All presentations" aria-label="All presentations" data-ic="back"></button>
      <input class="title" id="titleIn" aria-label="Presentation title" spellcheck="false">
      <span class="status" id="status" aria-live="polite"></span>
      <span class="grow"></span>
      <button class="tb" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo" data-ic="undo"></button>
      <button class="tb" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" data-ic="redo"></button>
      <label class="cl" for="themeSel">Theme</label>
      <select class="field" id="themeSel"></select>
      <button class="btn" id="aiBtn" title="Generate slides with AI"><span data-ic="spark"></span>Generate</button>
      <button class="btn" id="exportBtn"><span data-ic="download"></span>Export</button>
      <span class="split">
        <button class="btn primary" id="presentBtn" title="Present from current slide (Ctrl+Enter)"><span data-ic="play"></span>Present</button>
        <button class="btn primary" id="presentMenuBtn" aria-label="More present options" data-ic="caret"></button>
      </span>
    </div>

    <div class="tools" id="tools">
      <button class="tb" data-act="newslide" title="New slide (choose layout)" aria-label="New slide" data-ic="plus"></button>
      <span class="sep"></span>
      <button class="tb" data-act="text" title="Add text box" aria-label="Add text box" data-ic="text"></button>
      <button class="tb" data-act="shape" title="Add shape" aria-label="Add shape" data-ic="shape"></button>
      <button class="tb" data-act="image" title="Add image" aria-label="Add image" data-ic="image"></button>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
      <span class="sep"></span>
      <button class="tb" data-act="bold" title="Bold (Ctrl+B)" aria-label="Bold" style="font-weight:800">B</button>
      <button class="tb" data-act="italic" title="Italic (Ctrl+I)" aria-label="Italic" style="font-style:italic;font-family:Georgia,serif">I</button>
      <button class="tb" data-act="sizeDown" title="Smaller text" aria-label="Smaller text" data-ic="minus"></button>
      <input class="field" id="sizeIn" type="number" min="6" max="300" aria-label="Font size" title="Font size">
      <button class="tb" data-act="sizeUp" title="Larger text" aria-label="Larger text" data-ic="plus"></button>
      <button class="tb" data-act="alignL" title="Align left" aria-label="Align left" data-ic="alignL"></button>
      <button class="tb" data-act="alignC" title="Align centre" aria-label="Align centre" data-ic="alignC"></button>
      <button class="tb" data-act="alignR" title="Align right" aria-label="Align right" data-ic="alignR"></button>
      <span class="sep"></span>
      <label class="cl" for="colorIn">Text</label><input type="color" id="colorIn" title="Text colour">
      <label class="cl" for="fillIn">Fill</label><input type="color" id="fillIn" title="Fill colour">
      <button class="tb" data-act="reset" title="Reset colours to theme" aria-label="Reset colours to theme" data-ic="reset"></button>
      <span class="sep"></span>
      <button class="tb" data-act="front" title="Bring to front" aria-label="Bring to front" data-ic="front"></button>
      <button class="tb" data-act="forward" title="Bring forward" aria-label="Bring forward" data-ic="forward"></button>
      <button class="tb" data-act="backward" title="Send backward" aria-label="Send backward" data-ic="backward"></button>
      <button class="tb" data-act="back" title="Send to back" aria-label="Send to back" data-ic="back2"></button>
      <span class="sep"></span>
      <button class="tb" data-act="dup" title="Duplicate (Ctrl+D)" aria-label="Duplicate element" data-ic="dup"></button>
      <button class="tb" data-act="del" title="Delete (Del)" aria-label="Delete element" data-ic="trash"></button>
    </div>

    <div class="main">
      <aside id="film" aria-label="Slides">
        <div id="filmList"></div>
        <div class="addrow"><button class="btn" id="addSlideBtn"><span data-ic="plus"></span>New slide</button></div>
      </aside>
      <div class="center">
        <div id="stageWrap"><div id="stageBox"><div id="stage"></div></div></div>
        <div id="notes"><label for="notesIn">Speaker notes</label><textarea id="notesIn" placeholder="Add notes for this slide. Press N while presenting to see them."></textarea></div>
      </div>
    </div>
  </section>

  <div id="present" hidden>
    <div id="pStage"><div id="pBox"></div>
      <div id="pHud">
        <button id="pPrev" aria-label="Previous slide" data-ic="back"></button>
        <span class="info" id="pCount"></span>
        <button id="pNext" aria-label="Next slide" data-ic="fwd"></button>
        <span class="sp"></span>
        <button id="pTimer" class="info" title="Click to pause or resume the timer">0:00</button>
        <span class="sp"></span>
        <button id="pNotesBtn" title="Toggle speaker notes (N)">Notes <span style="font:11px var(--mono);opacity:.7">N</span></button>
        <button id="pExit" title="Exit (Esc)" aria-label="Exit presentation" data-ic="close"></button>
      </div>
    </div>
    <div id="pNotes" hidden><h4>Speaker notes</h4><div id="pNotesTxt"></div></div>
  </div>
  <div id="ai" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="aiH">
      <div class="dh"><h2 id="aiH">Generate slides with AI</h2><button class="tb" id="aiX" aria-label="Close" data-ic="close"></button></div>
      <label for="aiPrompt">What is the presentation about?</label>
      <textarea id="aiPrompt" rows="4" maxlength="2000" placeholder="e.g. A 10-minute introduction to how vaccines train the immune system, for high-school students"></textarea>
      <div class="row">
        <div><label for="aiCount">Slides</label><input type="number" id="aiCount" min="2" max="20" value="6"></div>
        <div><label for="aiTone">Tone</label><select id="aiTone"><option>Clear and professional</option><option>Casual and friendly</option><option>Educational</option><option>Persuasive pitch</option><option>Technical</option></select></div>
        <div><label for="aiMode">Add to deck</label><select id="aiMode"><option value="after">After this slide</option><option value="replace">Replace all slides</option></select></div>
      </div>
      <label class="chk"><input type="checkbox" id="aiNotes" checked> Write speaker notes</label>
      <div id="aiConn"></div>
      <div class="err" id="aiErr" role="alert" hidden></div>

<script>
(()=>{

/* ---------- icons ---------- */

/* ---------- themes & layouts ---------- */

/* ---------- slide rendering (inline styles only, so it can be exported) ---------- */
function elNode(e,th,images,live){
  const d=document.createElement('div');d.dataset.id=e.id;if(live)d.className='el';
  let css=`position:absolute;left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;box-sizing:border-box;`;
  if(e.type==='text'){
    const col=e.color||(e.role==='title'?th.title:th.text);
    css+=`font-family:${e.role==='title'?th.head:th.body};font-size:${e.size}px;font-weight:${e.bold?700:400};font-style:${e.italic?'italic':'normal'};text-align:${e.align};color:${col};line-height:1.22;padding:6px 10px;white-space:pre-wrap;overflow-wrap:break-word;background:${e.fill||'transparent'};`;
    d.style.cssText=css;d.textContent=e.text;
  }else if(e.type==='shape'){
    const fill=e.fill||th.accent;d.style.cssText=css;
    if(POLY[e.kind]){d.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" width="${e.w}" height="${e.h}" style="display:block;overflow:visible"><polygon points="${POLY[e.kind]}" fill="${fill}" stroke="${fill}" stroke-width="1" stroke-linejoin="round"/></svg>`;}
    else{d.style.background=fill;d.style.borderRadius=e.kind==='ellipse'?'50%':e.kind==='round'?Math.round(Math.min(e.w,e.h)*.18)+'px':'0';}
  }else{
    d.style.cssText=css;const src=images[e.img];
    if(src){const i=document.createElement('img');i.src=src;i.draggable=false;i.alt='';i.style.cssText='width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;';d.append(i);}
    else d.style.background='#bbb';
  }
  return d;
}
function slideDOM(slide,deck,live){
  const th=THEMES[deck.theme]||THEMES.light;const r=document.createElement('div');r.className='slide';
  r.style.cssText=`position:relative;width:${W}px;height:${H}px;overflow:hidden;flex:none;background:${th.bg};color:${th.text};font-family:${th.body};`;
  for(const e of slide.elements)r.append(elNode(e,th,deck.images,live));
  return r;
}
function scaledPreview(slide,deck,box){ // fills a .pv box (16:9) with a scaled slide
  const s=slideDOM(slide,deck,false);s.style.position='absolute';s.style.left='0';s.style.top='0';s.style.transformOrigin='0 0';s.style.pointerEvents='none';
  box.replaceChildren(s);
  const fit=()=>{const w=box.clientWidth||160;s.style.transform=`scale(${w/W})`};fit();
  if(!box.clientWidth)requestAnimationFrame(fit);
}

/* ---------- storage (IndexedDB with in-memory fallback) ---------- */
const store={db:null,ok:false,mem:new Map(),
 async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('deckhand',1);r.onupgradeneeded=()=>r.result.createObjectStore('decks',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej(new Error('timeout')),4000)});this.ok=true}catch(e){this.ok=false}},
 tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('decks',mode);const r=fn(t.objectStore('decks'));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)})},
 all(){return this.ok?this.tx('readonly',s=>s.getAll()):Promise.resolve([...this.mem.values()].map(d=>structuredClone(d)))},
 put(d){if(!this.ok){this.mem.set(d.id,structuredClone(d));return Promise.resolve()}return this.tx('readwrite',s=>s.put(d))},
 del(id){if(!this.ok){this.mem.delete(id);return Promise.resolve()}return this.tx('readwrite',s=>s.delete(id))}
};

/* ---------- deck model ---------- */
const COLOR=/^#[0-9a-f]{3,8}$/i;
const col=v=>typeof v==='string'&&COLOR.test(v)?v:null;
const num=(v,d)=>Number.isFinite(+v)?+v:d;
function sanitizeDeck(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.slides))throw new Error('This file is not a Deckhand presentation.');
  const images={};
  if(raw.images&&typeof raw.images==='object')for(const [k,v] of Object.entries(raw.images))if(typeof v==='string'&&/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(v))images[String(k)]=v;
  const slides=raw.slides.slice(0,500).map(s=>({id:uid(),notes:typeof s.notes==='string'?s.notes:'',elements:(Array.isArray(s.elements)?s.elements:[]).slice(0,500).map(e=>{
    const b={id:uid(),x:num(e.x,0),y:num(e.y,0),w:Math.max(10,num(e.w,100)),h:Math.max(10,num(e.h,50))};
    if(e.type==='text')return {...b,type:'text',text:String(e.text??''),role:['title','body','text'].includes(e.role)?e.role:'text',size:clamp(num(e.size,28),6,300),bold:!!e.bold,italic:!!e.italic,align:['left','center','right'].includes(e.align)?e.align:'left',color:col(e.color),fill:col(e.fill)};
    if(e.type==='shape')return {...b,type:'shape',kind:SHAPES[e.kind]?e.kind:'rect',fill:col(e.fill)};
    if(e.type==='image'&&images[e.img])return {...b,type:'image',img:String(e.img)};
    return null}).filter(Boolean)}));
  if(!slides.length)slides.push({id:uid(),notes:'',elements:LAYOUTS.title.make()});
  return {id:uid(),title:String(raw.title||'Untitled presentation').slice(0,200),theme:THEMES[raw.theme]?raw.theme:'light',created:num(raw.created,Date.now()),updated:Date.now(),slides,images};
}
const prunedImages=d=>{const used=new Set();d.slides.forEach(s=>s.elements.forEach(e=>e.img&&used.add(e.img)));const o={};for(const k of used)if(d.images[k])o[k]=d.images[k];return o};
const serial=d=>({id:d.id,title:d.title,theme:d.theme,created:d.created,updated:d.updated,slides:d.slides,images:prunedImages(d)});

function sampleDeck(){

  const b=[mkShape({kind:'ellipse',x:600,y:120,w:260,h:260}),mkShape({kind:'star',x:120,y:300,w:150,h:150}),
    mkText({x:90,y:140,w:480,h:120,text:'Your turn',role:'title',size:64,bold:true}),mkText({x:90,y:250,w:460,h:60,text:'Add a slide and make it yours.',role:'body',size:28,italic:true})];

function newDeck(){return {id:uid(),title:'Untitled presentation',theme:'light',created:Date.now(),updated:Date.now(),slides:[{id:uid(),notes:'',elements:LAYOUTS.title.make()}],images:{}}}

/* ---------- state ---------- */
let deck=null,cur=0,selId=null,editing=false,focusArea='stage',view='home',k=1;
let undoS=[],redoS=[],lastKey=null,lastT=0,clip=null;
const curSlide=()=>deck.slides[cur];
const curEl=()=>selId?curSlide().elements.find(e=>e.id===selId):null;
const snap=()=>JSON.stringify({title:deck.title,theme:deck.theme,slides:deck.slides});

function pushHist(key){
  const now=Date.now();
  if(key&&key===lastKey&&now-lastT<1000){lastT=now;return}
  undoS.push(snap());if(undoS.length>100)undoS.shift();redoS=[];lastKey=key;lastT=now;syncHist();
}
function syncHist(){$('#undoBtn').disabled=!undoS.length;$('#redoBtn').disabled=!redoS.length}
function restore(s){
  const o=JSON.parse(s);deck.title=o.title;deck.theme=o.theme;deck.slides=o.slides;
  cur=clamp(cur,0,deck.slides.length-1);if(selId&&!curEl())selId=null;
  lastKey=null;renderAll();scheduleSave();syncHist();
}
function undo(){if(!undoS.length)return;endEdit();redoS.push(snap());restore(undoS.pop())}
function redo(){if(!redoS.length)return;endEdit();undoS.push(snap());restore(redoS.pop())}
function change(fn,key,opts={}){
  endEdit();pushHist(key||null);fn();deck.updated=Date.now();
  renderStage();syncTools();scheduleThumb(cur);if(opts.film)renderFilm();scheduleSave();
}

/* ---------- save ---------- */
let saveT=null,dirty=false;
function setStatus(t){$('#status').textContent=t}
function scheduleSave(){dirty=true;setStatus('Saving…');clearTimeout(saveT);saveT=setTimeout(flush,450)}
async function flush(){
  clearTimeout(saveT);if(!deck||!dirty)return;dirty=false;
  try{deck.updated=deck.updated||Date.now();await store.put(serial(deck));setStatus(store.ok?'Saved':'Not saved (storage unavailable)')}
  catch(e){setStatus('Save failed');toast('Could not save. Browser storage may be full; export your deck as JSON.','err')}
}
addEventListener('pagehide',()=>{flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---------- toast, popover ---------- */
let toastT;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className=kind||'';t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,kind==='err'?5000:2600)}
const pop=$('#pop');
function openPop(anchor,node){
  pop.replaceChildren(node);pop.hidden=false;
  const r=anchor.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let x=clamp(r.left,8,innerWidth-pw-8),y=r.bottom+6;if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-6);
  pop.style.left=x+'px';pop.style.top=y+'px';
}
function openPopAt(x,y,node){pop.replaceChildren(node);pop.hidden=false;pop.style.left=clamp(x,8,innerWidth-pop.offsetWidth-8)+'px';pop.style.top=clamp(y,8,innerHeight-pop.offsetHeight-8)+'px'}
const closePop=()=>{pop.hidden=true;pop.replaceChildren()};
addEventListener('pointerdown',e=>{if(!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('[data-popbtn]'))closePop()},true);
function listMenu(items){
  const w=document.createElement('div');
  for(const it of items){const b=document.createElement('button');b.className='it'+(it.danger?' danger':'');b.type='button';
    b.innerHTML=(it.glyph?`<span class="glyph">${it.glyph}</span>`:'')+`<span></span>`+(it.kbd?`<kbd>${it.kbd}</kbd>`:'');b.children[it.glyph?1:0].textContent=it.label;
    b.onclick=()=>{closePop();it.run()};w.append(b)}
  return w;
}
function layoutPicker(onPick){
  const g=document.createElement('div');g.className='lay';
  for(const [key,L] of Object.entries(LAYOUTS)){
    const b=document.createElement('button');b.type='button';const pv=document.createElement('div');pv.className='pv';const sp=document.createElement('span');sp.textContent=L.name;b.append(pv,sp);
    b.onclick=()=>{closePop();onPick(key)};g.append(b);
    queueMicrotask(()=>scaledPreview({elements:L.make()},deck,pv));
  }
  return g;
}

/* ---------- file save (downloads capability when hosted, anchor otherwise) ---------- */
let dlCap;
async function getDl(){if(dlCap!==undefined)return dlCap;try{dlCap=window.claude?.use?await window.claude.use('downloads'):null}catch(e){dlCap=null}return dlCap}
async function saveFile(name,blob){
  const dl=await getDl();
  if(dl){try{await dl.save({filename:name,data:blob});toast('Saved '+name)}catch(e){if(e&&e.code==='declined')return;toast('Could not save the file: '+(e&&(e.message||e.code)||'unknown error'),'err')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2500);toast('Downloading '+name);
}
const fileSlug=t=>(t||'presentation').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'presentation';
function exportJSON(d){const blob=new Blob([JSON.stringify({app:'deckhand',version:1,...serial(d)})],{type:'application/json'});return saveFile(fileSlug(d.title)+'.json',blob)}

/* ---------- PDF export (slides rendered via SVG foreignObject -> canvas -> JPEG, assembled by hand) ---------- */
async function slideToJpeg(slide,d){
  const node=slideDOM(slide,d,false);node.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
  const xml=new XMLSerializer().serializeToString(node);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 ${W} ${H}"><foreignObject width="${W}" height="${H}">${xml}</foreignObject></svg>`;
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  try{
    const img=new Image();img.src=url;await img.decode();await new Promise(r=>setTimeout(r,30));
    const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1920,1080);x.drawImage(img,0,0,1920,1080);
    const b64=c.toDataURL('image/jpeg',0.92).split(',')[1];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return {bytes:u,w:1920,h:1080};
  }finally{}
}
function buildPDF(pages){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);len+=u.length};
  const n=pages.length,total=2+3*n;
  push('%PDF-1.4\n%âãÏÓ\n');
  off[1]=len;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  off[2]=len;push(`2 0 obj\n<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\nendobj\n`);
  pages.forEach((p,i)=>{
    const po=3+3*i,co=po+1,io=po+2,content='q 960 0 0 540 0 0 cm /Im0 Do Q';
    off[po]=len;push(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 960 540] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    off[co]=len;push(`${co} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    off[io]=len;push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`);push(p.bytes);push('\nendstream\nendobj\n');
  });
  const xo=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;for(let i=1;i<=total;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportPDF(d){
  try{
    const pages=[];for(let i=0;i<d.slides.length;i++){toast(`Rendering slide ${i+1} of ${d.slides.length}…`);pages.push(await slideToJpeg(d.slides[i],d))}
    await saveFile(fileSlug(d.title)+'.pdf',buildPDF(pages));
  }catch(e){console.error(e);toast('PDF export failed in this browser. Export JSON instead.','err')}
}

/* ---------- home ---------- */
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
async function showHome(){
  view='home';$('#editor').hidden=true;$('#home').hidden=false;
  const decks=(await store.all()).sort((a,b)=>b.updated-a.updated);
  const g=$('#deckGrid');g.replaceChildren();
  $('#homeNote').hidden=store.ok;if(!store.ok){$('#homeNote').textContent='Browser storage is unavailable here, so presentations will be lost when you close this tab. Export JSON to keep them.'}
  if(!decks.length){const e=document.createElement('div');e.className='empty';e.textContent='No presentations yet. Create one or import a JSON export.';g.append(e);return}
  for(const d of decks){
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<div class="pv" tabindex="0" role="button"></div><div class="meta"><div class="nm"></div><div class="sub"></div></div><div class="acts"></div>';
    c.querySelector('.nm').textContent=d.title;c.querySelector('.sub').textContent=`${d.slides.length} slide${d.slides.length>1?'s':''} · ${THEMES[d.theme]?.name||''} · ${ago(d.updated)}`;
    const pv=c.querySelector('.pv');const open=()=>openDeck(d);pv.onclick=open;pv.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
    const acts=c.querySelector('.acts');
    const mk=(label,fn,cls)=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;acts.append(b);return b};
    mk('Open',open);
    mk('Duplicate',async()=>{const cp=structuredClone(d);cp.id=uid();cp.title=d.title+' (copy)';cp.updated=Date.now();await store.put(cp);showHome()});
    mk('Export',()=>exportJSON(d));
    const del=mk('Delete',()=>{if(del.dataset.arm){store.del(d.id).then(showHome)}else{del.dataset.arm=1;del.textContent='Confirm delete';del.classList.add('danger');setTimeout(()=>{del.textContent='Delete';del.classList.remove('danger');delete del.dataset.arm},3000)}});
    g.append(c);scaledPreview(d.slides[0],d,pv);
  }
}
$('#newDeckBtn').onclick=async()=>{const d=newDeck();await store.put(d);openDeck(d)};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{if(f.size>60e6)throw new Error('File is too large (limit 60 MB).');const raw=JSON.parse(await f.text());const d=sanitizeDeck(raw.deck||raw);
    d.title=d.title;await store.put(serial(d));toast('Imported “'+d.title+'”');showHome()}
  catch(e){toast(e.message||'Could not read that file.','err')}
};

/* ---------- editor open/close ---------- */
function openDeck(d){
  deck=d;deck.images=deck.images||{};cur=0;selId=null;editing=false;undoS=[];redoS=[];lastKey=null;dirty=false;
  view='editor';$('#home').hidden=true;$('#editor').hidden=false;
  const sel=$('#themeSel');if(!sel.options.length)for(const [key,t] of Object.entries(THEMES)){const o=document.createElement('option');o.value=key;o.textContent=t.name;sel.append(o)}
  sel.value=deck.theme;$('#titleIn').value=deck.title;setStatus(store.ok?'Saved':'Not saved (storage unavailable)');
  renderAll();syncHist();requestAnimationFrame(fitStage);
}
$('#homeBtn').onclick=async()=>{endEdit();await flush();showHome()};

/* ---------- rendering ---------- */
function renderAll(){
  $('#titleIn').value=deck.title;$('#themeSel').value=deck.theme;
  renderFilm();renderStage();$('#notesIn').value=curSlide().notes||'';syncTools();
}
const stageEl=$('#stage'),box=$('#stageBox');
function fitStage(){
  const w=$('#stageWrap').clientWidth,h=$('#stageWrap').clientHeight;if(!w||!h)return;
  k=Math.max(.05,Math.min((w-32)/W,(h-32)/H));
  box.style.width=W*k+'px';box.style.height=H*k+'px';box.style.setProperty('--u',1/k);stageEl.style.transform=`scale(${k})`;
}
new ResizeObserver(fitStage).observe($('#stageWrap'));
let selBox=null,guideV=null,guideH=null;
function renderStage(){
  const sl=slideDOM(curSlide(),deck,true);
  selBox=document.createElement('div');selBox.id='sel';selBox.hidden=true;
  for(const h of ['nw','n','ne','e','se','s','sw','w']){const d=document.createElement('div');d.className='h';d.dataset.h=h;selBox.append(d)}
  guideV=document.createElement('div');guideV.className='guide';guideV.hidden=true;guideH=document.createElement('div');guideH.className='guide';guideH.hidden=true;
  stageEl.replaceChildren(sl,guideV,guideH,selBox);
  // grow text boxes whose content overflows
  for(const e of curSlide().elements)if(e.type==='text'){const n=nodeOf(e.id);if(n&&n.scrollHeight>n.offsetHeight+1){e.h=Math.ceil(n.scrollHeight);n.style.height=e.h+'px'}}
  drawSel();
}
const nodeOf=id=>stageEl.querySelector(`[data-id="${id}"]`);
function drawSel(){
  const e=curEl();if(!e||editing){selBox.hidden=true;return}
  selBox.hidden=false;Object.assign(selBox.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'});
}
function applyGeom(e){const n=nodeOf(e.id);if(!n)return;Object.assign(n.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'});
  if(e.type==='shape'&&POLY[e.kind]){const s=n.querySelector('svg');if(s){s.setAttribute('width',e.w);s.setAttribute('height',e.h)}}
  else if(e.type==='shape'&&e.kind==='round')n.style.borderRadius=Math.round(Math.min(e.w,e.h)*.18)+'px';
  drawSel()}
function select(id){selId=id;drawSel();syncTools()}

let thumbT=new Map();
function scheduleThumb(i){clearTimeout(thumbT.get(i));thumbT.set(i,setTimeout(()=>{const it=$('#filmList').children[i];if(it)scaledPreview(deck.slides[i],deck,it.querySelector('.pv'))},180))}

const film=$('#filmList');

let dragI=null;

film.addEventListener('dragover',e=>{if(dragI===null)return;const it=e.target.closest('.th');if(!it)return;e.preventDefault();
  film.querySelectorAll('.drop-a,.drop-b').forEach(n=>n.classList.remove('drop-a','drop-b'));
  const r=it.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;it.classList.add(after?'drop-b':'drop-a')});

film.addEventListener('dragend',()=>{dragI=null;film.querySelectorAll('.drop-a,.drop-b').forEach(n=>n.classList.remove('drop-a','drop-b'))});
film.addEventListener('drop',e=>{
  if(dragI===null)return;e.preventDefault();const it=e.target.closest('.th');if(!it){dragI=null;return}
  const r=it.getBoundingClientRect();let to=+it.dataset.i+(e.clientY>r.top+r.height/2?1:0);const from=dragI;dragI=null;
  film.querySelectorAll('.drop-a,.drop-b').forEach(n=>n.classList.remove('drop-a','drop-b'));
  if(to>from)to--;if(to===from)return;moveSlide(from,to);
});

/* ---------- slide operations ---------- */
function gotoSlide(i){
  i=clamp(i,0,deck.slides.length-1);endEdit();if(i===cur)return;cur=i;selId=null;
  $('#filmList').querySelectorAll('.th').forEach((n,j)=>n.classList.toggle('cur',j===i));
  renderStage();$('#notesIn').value=curSlide().notes||'';syncTools();$('#filmList').children[i]?.scrollIntoView({block:'nearest',inline:'nearest'});
}
function newSlide(layout,at){
  at=at===undefined?cur+1:at;endEdit();pushHist(null);
  deck.slides.splice(at,0,{id:uid(),notes:'',elements:LAYOUTS[layout].make()});cur=at;selId=null;deck.updated=Date.now();renderAll();scheduleSave();
}
function dupSlide(i){
  endEdit();pushHist(null);const c=structuredClone(deck.slides[i]);c.id=uid();c.elements.forEach(e=>e.id=uid());deck.slides.splice(i+1,0,c);cur=i+1;selId=null;deck.updated=Date.now();renderAll();scheduleSave();
}
function delSlide(i){
  if(deck.slides.length<2){toast('A presentation needs at least one slide.');return}
  endEdit();pushHist(null);deck.slides.splice(i,1);cur=clamp(i>=cur?cur:cur-1,0,deck.slides.length-1);if(i===cur+0&&i>=deck.slides.length)cur=deck.slides.length-1;selId=null;deck.updated=Date.now();renderAll();scheduleSave();
}
function moveSlide(from,to){
  endEdit();pushHist(null);const [s]=deck.slides.splice(from,1);deck.slides.splice(to,0,s);cur=to;selId=null;deck.updated=Date.now();renderAll();scheduleSave();
}
$('#addSlideBtn').onclick=e=>{e.currentTarget.dataset.popbtn=1;openPop(e.currentTarget,layoutPicker(l=>newSlide(l)))};

/* ---------- element creation ---------- */
function addEl(e){change(()=>{curSlide().elements.push(e);selId=e.id},null);}
function addText(){const e=mkText({x:300,y:230,w:360,h:56,text:'New text',size:28});addEl(e);startEdit(e.id)}
function addShape(kind){addEl(mkShape({kind,x:380,y:170,w:200,h:kind==='arrow'?120:200}))}
async function downscale(file,max=1600){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw new Error('bad image');
    const sc=Math.min(1,max/Math.max(w,h));const cw=Math.round(w*sc),ch=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');
    const png=/png|gif|webp|svg/.test(file.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,cw,ch)}
    x.imageSmoothingQuality='high';x.drawImage(img,0,0,cw,ch);
    return {src:c.toDataURL(png?'image/png':'image/jpeg',0.86),w:cw,h:ch};
  }finally{URL.revokeObjectURL(url)}
}
async function addImages(files){
  const list=[...files].filter(f=>f.type.startsWith('image/'));if(!list.length)return;
  for(const f of list){
    try{
      const r=await downscale(f);const id=uid();deck.images[id]=r.src;
      const sc=Math.min(1,600/r.w,400/r.h);const w=Math.round(r.w*sc),h=Math.round(r.h*sc);
      addEl({id:uid(),type:'image',img:id,x:Math.round((W-w)/2),y:Math.round((H-h)/2),w,h});
    }catch(e){toast('Could not read '+f.name+' as an image.','err')}
  }
}
$('#imgFile').onchange=e=>{addImages(e.target.files);e.target.value=''};
$('#stageWrap').addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
$('#stageWrap').addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addImages(e.dataTransfer.files)}});

/* ---------- toolbar ---------- */
const SIZES=[10,12,14,16,18,20,24,28,32,36,44,54,66,80,96,120];
function bump(dir){const e=curEl();if(!e||e.type!=='text')return;let s=e.size;
  const n=dir>0?SIZES.find(v=>v>s):[...SIZES].reverse().find(v=>v<s);setProp('size',n||s,'size')}
function setProp(p,v,key){const e=curEl();if(!e)return;change(()=>{e[p]=v},key)}
function reorder(how){
  const els=curSlide().elements,i=els.findIndex(e=>e.id===selId);if(i<0)return;
  const j=how==='front'?els.length-1:how==='back'?0:how==='forward'?Math.min(els.length-1,i+1):Math.max(0,i-1);if(j===i)return;
  change(()=>{const [e]=els.splice(i,1);els.splice(j,0,e)},null);
}
function dupEl(){const e=curEl();if(!e)return;const c=structuredClone(e);c.id=uid();c.x+=24;c.y+=24;addEl(c)}
function delEl(){const e=curEl();if(!e)return;change(()=>{const els=curSlide().elements;els.splice(els.findIndex(x=>x.id===e.id),1);selId=null},null)}
function copyEl(){const e=curEl();if(e){clip=structuredClone(e);return true}return false}
function pasteEl(){if(!clip)return;const c=structuredClone(clip);c.id=uid();c.x=clamp(c.x+24,0,W-20);c.y=clamp(c.y+24,0,H-20);clip.x=c.x;clip.y=c.y;addEl(c)}
$('#tools').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;focusArea='stage';const a=b.dataset.act;
  switch(a){
    case 'newslide':b.dataset.popbtn=1;openPop(b,layoutPicker(l=>newSlide(l)));break;
    case 'text':addText();break;
    case 'shape':b.dataset.popbtn=1;openPop(b,listMenu(Object.keys(SHAPES).map(s=>({label:SHAPES[s],glyph:SHAPE_GLYPH[s],run:()=>addShape(s)}))));break;
    case 'image':$('#imgFile').click();break;
    case 'bold':{const e=curEl();if(e)setProp('bold',!e.bold);break}
    case 'italic':{const e=curEl();if(e)setProp('italic',!e.italic);break}
    case 'sizeDown':bump(-1);break;case 'sizeUp':bump(1);break;
    case 'alignL':setProp('align','left');break;case 'alignC':setProp('align','center');break;case 'alignR':setProp('align','right');break;
    case 'reset':{const e=curEl();if(e)change(()=>{e.color=null;e.fill=null},null);break}
    case 'front':case 'forward':case 'backward':case 'back':reorder(a);break;
    case 'dup':dupEl();break;case 'del':delEl();break;
  }
});
$('#sizeIn').onchange=e=>{const v=clamp(Math.round(+e.target.value)||28,6,300);setProp('size',v,'size')};
$('#colorIn').oninput=e=>setProp('color',e.target.value,'color');
$('#fillIn').oninput=e=>setProp('fill',e.target.value,'fill');
$('#themeSel').onchange=e=>{const v=e.target.value;change(()=>{deck.theme=v},null,{film:true})};
$('#titleIn').oninput=e=>{pushHist('title');deck.title=e.target.value.slice(0,200);deck.updated=Date.now();scheduleSave()};
$('#titleIn').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
$('#notesIn').oninput=e=>{pushHist('notes'+curSlide().id);curSlide().notes=e.target.value;deck.updated=Date.now();scheduleSave()};
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
function syncTools(){
  const e=curEl(),t=e&&e.type==='text',s=e&&e.type==='shape';
  const T=(a,on,dis)=>{const b=$(`[data-act="${a}"]`);if(!b)return;b.classList.toggle('on',!!on);b.disabled=!!dis};
  T('bold',t&&e.bold,!t);T('italic',t&&e.italic,!t);T('sizeDown',0,!t);T('sizeUp',0,!t);
  T('alignL',t&&e.align==='left',!t);T('alignC',t&&e.align==='center',!t);T('alignR',t&&e.align==='right',!t);
  ['reset','front','forward','backward','back','dup','del'].forEach(a=>T(a,0,!e));
  const th=THEMES[deck.theme];
  $('#sizeIn').disabled=!t;$('#sizeIn').value=t?e.size:'';
  $('#colorIn').disabled=!t;$('#colorIn').value=t?(e.color||(e.role==='title'?th.title:th.text)):'#000000';
  $('#fillIn').disabled=!(t||s);$('#fillIn').value=(t||s)?(e.fill||(s?th.accent:'#ffffff')):'#ffffff';
}

/* ---------- text editing ---------- */
function startEdit(id){
  const e=curSlide().elements.find(x=>x.id===id);if(!e||e.type!=='text')return;
  selId=id;editing=true;drawSel();const n=nodeOf(id);
  tryDo(()=>{n.contentEditable='plaintext-only'});if(n.contentEditable!=='plaintext-only')n.contentEditable='true';
  n.spellcheck=false;n.focus();
  const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r);
  n.onblur=()=>finishEdit(id);
  n.onkeydown=ev=>{if(ev.key==='Escape'){ev.preventDefault();n.blur()}};
  n.onpaste=ev=>{ev.preventDefault();const t=(ev.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)};
}
function endEdit(){if(editing){const n=document.activeElement;if(n&&n.isContentEditable)n.blur();else editing=false}}
function finishEdit(id){
  if(!editing)return;editing=false;
  const e=curSlide().elements.find(x=>x.id===id),n=nodeOf(id);if(!e||!n){return}
  let t=n.innerText.replace(/ /g,' ');if(t.endsWith('\n'))t=t.slice(0,-1);
  n.onblur=null;n.removeAttribute('contenteditable');
  if(t!==e.text){pushHist(null);e.text=t;deck.updated=Date.now();scheduleSave();scheduleThumb(cur)}
  renderStage();syncTools();
}

/* ---------- pointer interactions on the stage ---------- */
stageEl.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;focusArea='stage';
  if(editing){if(ev.target.closest('[contenteditable]'))return;endEdit()}
  const h=ev.target.closest('.h');if(h){startResize(ev,h.dataset.h);return}
  const n=ev.target.closest('.el');
  if(n){select(n.dataset.id);startMove(ev)}else select(null);
});
stageEl.addEventListener('dblclick',ev=>{const n=ev.target.closest('.el');if(n&&!editing){const e=curSlide().elements.find(x=>x.id===n.dataset.id);if(e&&e.type==='text')startEdit(e.id)}});
function drag(ev,onMove,onEnd){
  const sx=ev.clientX,sy=ev.clientY;stageEl.setPointerCapture(ev.pointerId);
  const mv=m=>onMove((m.clientX-sx)/k,(m.clientY-sy)/k,m);
  const up=()=>{stageEl.removeEventListener('pointermove',mv);stageEl.removeEventListener('pointerup',up);stageEl.removeEventListener('pointercancel',up);guideV.hidden=guideH.hidden=true;onEnd()};
  stageEl.addEventListener('pointermove',mv);stageEl.addEventListener('pointerup',up);stageEl.addEventListener('pointercancel',up);
}
function startMove(ev){
  const e=curEl();if(!e)return;const ox=e.x,oy=e.y;let moved=false;
  drag(ev,(dx,dy)=>{
    if(!moved){if(Math.hypot(dx,dy)*k<3)return;moved=true;pushHist(null)}
    let nx=ox+dx,ny=oy+dy,gx=null,gy=null;
    const sn=(p,size,max)=>{for(const [q,g] of [[0,0],[(max-size)/2,max/2],[max-size,max]])if(Math.abs(p-q)<6)return [q,g];return [p,null]};
    [nx,gx]=sn(nx,e.w,W);[ny,gy]=sn(ny,e.h,H);
    e.x=Math.round(nx);e.y=Math.round(ny);applyGeom(e);
    Object.assign(guideV.style,{left:(gx??0)+'px',top:'0',width:(1/k*1.5)+'px',height:H+'px'});guideV.hidden=gx===null;
    Object.assign(guideH.style,{top:(gy??0)+'px',left:'0',height:(1/k*1.5)+'px',width:W+'px'});guideH.hidden=gy===null;
  },()=>{if(moved){deck.updated=Date.now();scheduleThumb(cur);scheduleSave()}});
}
function startResize(ev,hd){
  const e=curEl();if(!e)return;const o={x:e.x,y:e.y,w:e.w,h:e.h};let moved=false;
  drag(ev,(dx,dy,m)=>{
    if(!moved){moved=true;pushHist(null)}
    let w=o.w,h=o.h;
    if(hd.includes('e'))w=o.w+dx;if(hd.includes('w'))w=o.w-dx;if(hd.includes('s'))h=o.h+dy;if(hd.includes('n'))h=o.h-dy;
    if(hd.length===2&&(e.type==='image'||m.shiftKey)){const sc=Math.max(Math.abs(w/o.w),Math.abs(h/o.h));w=o.w*sc;h=o.h*sc}
    w=Math.max(24,w);h=Math.max(24,h);
    e.w=Math.round(w);e.h=Math.round(h);e.x=hd.includes('w')?Math.round(o.x+o.w-e.w):o.x;e.y=hd.includes('n')?Math.round(o.y+o.h-e.h):o.y;applyGeom(e);
  },()=>{if(moved){deck.updated=Date.now();renderStage();scheduleThumb(cur);scheduleSave()}});
}

/* ---------- keyboard ---------- */
const typing=t=>t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&t.type!=='color'&&t.type!=='button');
document.addEventListener('keydown',ev=>{
  if(presenting||view!=='editor'||!$('#ai').hidden)return;
  const mod=ev.ctrlKey||ev.metaKey,key=ev.key.toLowerCase(),t=ev.target;
  if(mod&&key==='enter'){ev.preventDefault();startPresent(ev.shiftKey?0:cur);return}
  if(editing&&t.isContentEditable){if(mod&&(key==='b'||key==='i')){ev.preventDefault();const id=selId;endEdit();setProp(key==='b'?'bold':'italic',!curEl()[key==='b'?'bold':'italic'])}return}
  if(typing(t)){return}
  if(mod&&key==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return}
  if(mod&&key==='y'){ev.preventDefault();redo();return}
  const e=curEl();
  if(mod&&key==='d'){ev.preventDefault();e?dupEl():dupSlide(cur);return}
  if(mod&&key==='c'&&e){ev.preventDefault();copyEl();toast('Copied');return}
  if(mod&&key==='x'&&e){ev.preventDefault();copyEl();delEl();return}
  if(mod&&(key==='b'||key==='i')&&e&&e.type==='text'){ev.preventDefault();setProp(key==='b'?'bold':'italic',!e[key==='b'?'bold':'italic']);return}
  if(mod)return;
  if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();if(focusArea==='film')delSlide(cur);else if(e)delEl();return}
  if(ev.key==='Escape'){select(null);return}
  if(ev.key==='Enter'&&e&&e.type==='text'){ev.preventDefault();startEdit(e.id);return}
  if(ev.key.startsWith('Arrow')){
    if(e&&focusArea!=='film'){ev.preventDefault();const st=ev.shiftKey?10:1;const d={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[ev.key];
      change(()=>{e.x+=d[0];e.y+=d[1]},'nudge'+e.id);return}
    if(ev.key==='ArrowUp'||ev.key==='ArrowLeft'){ev.preventDefault();gotoSlide(cur-1)}else{ev.preventDefault();gotoSlide(cur+1)}
    return;
  }
  if(ev.key==='PageUp'){ev.preventDefault();gotoSlide(cur-1)}
  if(ev.key==='PageDown'){ev.preventDefault();gotoSlide(cur+1)}
});
document.addEventListener('paste',ev=>{
  if(presenting||view!=='editor'||typing(ev.target))return;
  const files=[...(ev.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));
  if(files.length){ev.preventDefault();addImages(files)}else if(clip){ev.preventDefault();pasteEl()}
});
$('#stageWrap').addEventListener('pointerdown',ev=>{if(ev.target===ev.currentTarget){endEdit();select(null);focusArea='stage'}});

/* ---------- export + present menus ---------- */
$('#exportBtn').onclick=e=>{const b=e.currentTarget;b.dataset.popbtn=1;endEdit();openPop(b,listMenu([
  {label:'Download as PDF',glyph:'⇩',run:()=>exportPDF(deck)},{label:'Download as JSON',glyph:'{}',run:()=>exportJSON(deck)}]))};
$('#presentBtn').onclick=()=>startPresent(cur);
$('#presentMenuBtn').onclick=e=>{const b=e.currentTarget;b.dataset.popbtn=1;openPop(b,listMenu([
  {label:'From the beginning',glyph:'▶',kbd:'Ctrl+⇧+↵',run:()=>startPresent(0)},{label:'From this slide',glyph:'▷',kbd:'Ctrl+↵',run:()=>startPresent(cur)}]))};

/* ---------- present mode ---------- */
let presenting=false,pIdx=0,pStart=0,pPaused=false,pElapsed=0,pTick=null,hudT=null,showNotes=false;
const P=$('#present'),pBox=$('#pBox'),pStage=$('#pStage');
function startPresent(from){
  endEdit();flush();document.activeElement?.blur?.();presenting=true;pIdx=clamp(from,0,deck.slides.length-1);showNotes=false;$('#pNotes').hidden=true;$('#pNotesBtn').classList.remove('on');
  P.hidden=false;pElapsed=0;pPaused=false;pStart=Date.now();clearInterval(pTick);pTick=setInterval(tick,500);tick();
  tryDo(()=>{const r=P.requestFullscreen?.();r&&r.catch&&r.catch(()=>{})});
  pDraw();wakeHud();$('#pTimer').textContent='0:00';
}
function exitPresent(){
  if(!presenting)return;presenting=false;clearInterval(pTick);P.hidden=true;
  if(document.fullscreenElement)tryDo(()=>document.exitFullscreen());
  cur=pIdx;selId=null;renderAll();
}
function tick(){
  if(!pPaused)pElapsed=Date.now()-pStart;else pStart=Date.now()-pElapsed;
  const s=Math.floor(pElapsed/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  $('#pTimer').textContent=(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');
}
function pFit(){
  const w=pStage.clientWidth,h=pStage.clientHeight;if(!w||!h)return;
  const s=Math.min(w/W,h/H);pBox.style.width=W*s+'px';pBox.style.height=H*s+'px';const sl=pBox.firstChild;if(sl)sl.style.transform=`scale(${s})`;
}
function pDraw(){
  const sl=slideDOM(deck.slides[pIdx],deck,false);sl.style.position='absolute';sl.style.transformOrigin='0 0';pBox.replaceChildren(sl);pFit();
  $('#pCount').textContent=`${pIdx+1} / ${deck.slides.length}`;
  const n=deck.slides[pIdx].notes||'';const el=$('#pNotesTxt');el.textContent=n||'No notes for this slide.';el.classList.toggle('none',!n);
}
function pGo(d){
  const n=pIdx+d;if(n>=deck.slides.length){exitPresent();return}if(n<0)return;pIdx=n;pDraw();
}
function pToggleNotes(){showNotes=!showNotes;$('#pNotes').hidden=!showNotes;$('#pNotesBtn').classList.toggle('on',showNotes);pFit()}
function wakeHud(){const h=$('#pHud');h.classList.remove('hide');P.style.cursor='default';clearTimeout(hudT);hudT=setTimeout(()=>{h.classList.add('hide');P.style.cursor='none'},2600)}
new ResizeObserver(()=>{if(presenting)pFit()}).observe(pStage);
pStage.addEventListener('click',e=>{if(e.target.closest('#pHud'))return;pGo(1)});
P.addEventListener('mousemove',wakeHud);
$('#pPrev').onclick=()=>pGo(-1);$('#pNext').onclick=()=>pGo(1);$('#pExit').onclick=exitPresent;$('#pNotesBtn').onclick=pToggleNotes;
$('#pTimer').onclick=()=>{pPaused=!pPaused;$('#pTimer').style.opacity=pPaused?.5:1};
document.addEventListener('keydown',ev=>{
  if(!presenting)return;const k2=ev.key;wakeHud();
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k2)){ev.preventDefault();pGo(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k2)){ev.preventDefault();pGo(-1)}
  else if(k2==='Home'){ev.preventDefault();pIdx=0;pDraw()}
  else if(k2==='End'){ev.preventDefault();pIdx=deck.slides.length-1;pDraw()}
  else if(k2.toLowerCase()==='n'){ev.preventDefault();pToggleNotes()}
  else if(k2==='Escape'){ev.preventDefault();exitPresent()}
  else if(k2.toLowerCase()==='f'){tryDo(()=>document.fullscreenElement?document.exitFullscreen():P.requestFullscreen().catch(()=>{}))}
},true);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&presenting)exitPresent()});


/* ---------- AI generation ---------- */
const AI_LS='deckhand.ai';
let aiCfg={key:'',model:'claude-sonnet-5-5',remember:false},aiCtl=null,aiBusy=false;
tryDo(()=>{const o=JSON.parse(localStorage.getItem(AI_LS)||'null');if(o&&typeof o==='object')aiCfg={...aiCfg,key:String(o.key||''),model:String(o.model||aiCfg.model),remember:true}});
let sampleCap;
async function getSample(){if(sampleCap!==undefined)return sampleCap;try{sampleCap=window.claude?.use?await window.claude.use('sample'):null}catch(e){sampleCap=null}return sampleCap}
function aiPrompt(){
  const topic=$('#aiPrompt').value.trim()||'(describe the topic here)',n=clamp(Math.round(+$('#aiCount').value)||6,2,20),notes=$('#aiNotes').checked;
  return `You write slide decks. Reply with ONLY a JSON object, no markdown fences and no commentary.

Schema:
{"title":"deck title","slides":[{"layout":"title|bullets|two|statement","title":"...","subtitle":"(title layout only, optional)","bullets":["..."],"left_heading":"...","left":["..."],"right_heading":"...","right":["..."],"notes":"..."}]}

Layouts: "title" = title + optional subtitle (use for the first slide); "bullets" = title + 3 to 5 bullets; "two" = title + two columns (left_heading/left, right_heading/right, 2 to 4 bullets each), good for comparisons; "statement" = one short, strong sentence in "title" (use at most once or twice).

Rules: exactly ${n} slides. Bullets are concrete and specific, under 14 words, with no leading bullet characters. Slide titles are under 8 words. ${notes?'Give every slide "notes": 1 to 3 sentences the speaker can say aloud.':'Leave "notes" out.'} Tone: ${$('#aiTone').value}. Do not invent statistics or quotations.

Topic: ${topic}`;
}
function aiSlides(o,withNotes){
  if(!o||!Array.isArray(o.slides)||!o.slides.length)throw new Error('The reply did not contain any slides.');
  const str=(v,n)=>typeof v==='string'?v.trim().slice(0,n):typeof v==='number'?String(v):'';
  const list=v=>(Array.isArray(v)?v:[]).map(x=>str(x,220).replace(/^[•\-\*]\s*/,'')).filter(Boolean).slice(0,8);
  const body=a=>a.map(x=>'• '+x).join('\n');
  const fitSize=(txt,base)=>txt.length>380?base-6:txt.length>240?base-3:base;
  return o.slides.slice(0,20).map((s,i)=>{
    s=s&&typeof s==='object'?s:{};
    const lay=['title','bullets','two','statement'].includes(s.layout)?s.layout:(i===0?'title':'bullets');
    const title=str(s.title,160)||'Untitled';let els;
    if(lay==='title'){
      els=LAYOUTS.title.make();els[1].text=title;if(title.length>46)els[1].size=48;
      const sub=str(s.subtitle,180);if(sub)els[2].text=sub;else els.pop();
    }else if(lay==='statement'){
      els=[mkShape({x:0,y:0,w:28,h:540}),mkText({x:100,y:140,w:760,h:260,text:title,role:'title',size:title.length>90?36:48,bold:true})];
    }else if(lay==='two'){
      els=LAYOUTS.two.make();els[0].text=title;if(title.length>46)els[0].size=32;
      const l=[str(s.left_heading,60),...list(s.left).map(x=>'• '+x)].filter(Boolean).join('\n'),r=[str(s.right_heading,60),...list(s.right).map(x=>'• '+x)].filter(Boolean).join('\n');
      els[2].text=l||'• …';els[3].text=r||'• …';els[2].size=els[3].size=fitSize(l+r,26)-(l.length+r.length>300?2:0);
    }else{
      els=LAYOUTS.content.make();els[0].text=title;if(title.length>46)els[0].size=32;
      const b=body(list(s.bullets));els[2].text=b||'• …';els[2].size=fitSize(b,28);
    }
    return {id:uid(),notes:withNotes?str(s.notes,1200):'',elements:els};
  });
}
function parseAiJSON(text){
  let t=String(text||'').replace(/```(?:json)?/gi,'');const i=t.indexOf('{'),j=t.lastIndexOf('}');
  if(i<0||j<=i)throw new Error('No JSON found in the reply.');
  try{return JSON.parse(t.slice(i,j+1))}catch(e){throw new Error('The reply was not valid JSON. Try generating again.')}
}
function applyAi(text){
  const o=parseAiJSON(text),slides=aiSlides(o,$('#aiNotes').checked);
  endEdit();pushHist(null);
  if($('#aiMode').value==='replace'){deck.slides=slides;cur=0}else{deck.slides.splice(cur+1,0,...slides);cur=cur+1}
  const t=typeof o.title==='string'?o.title.trim().slice(0,120):'';
  if(t&&($('#aiMode').value==='replace'||deck.title==='Untitled presentation'))deck.title=t;
  selId=null;deck.updated=Date.now();renderAll();scheduleSave();toast(`Added ${slides.length} slide${slides.length>1?'s':''}`);
}
function aiErr(m){const e=$('#aiErr');e.textContent=m||'';e.hidden=!m}
function aiBusyUI(b,msg){aiBusy=b;$('#aiGo').disabled=b;$('#aiApply').disabled=b;$('#aiPrompt').disabled=b;$('#aiState').textContent=msg||'';$('#aiCancel').textContent=b?'Stop':'Cancel'}
async function openAI(opts={}){
  $('#aiMode').value=opts.replace?'replace':'after';aiErr('');aiBusyUI(false);
  const smp=await getSample(),c=$('#aiConn');c.replaceChildren();
  if(smp){const p=document.createElement('div');p.className='hint';p.textContent='Runs on Claude through this page. No API key needed.';c.append(p)}
  else{
    c.innerHTML='<label for="aiKey">Anthropic API key</label><input type="password" id="aiKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"><label for="aiModel">Model</label><input type="text" id="aiModel" spellcheck="false"><label class="chk"><input type="checkbox" id="aiRemember"> Remember the key in this browser</label><div class="hint">The key stays in this browser and is sent only to api.anthropic.com. Use a key with a spend limit.</div>';
    $('#aiKey').value=aiCfg.key;$('#aiModel').value=aiCfg.model;$('#aiRemember').checked=aiCfg.remember;
  }
  $('#aiManual').open=!smp&&!aiCfg.key;$('#aiPromptOut').value=aiPrompt();
  $('#ai').hidden=false;$('#aiPrompt').focus();
}
function closeAI(){if(aiBusy&&aiCtl)aiCtl.abort();$('#ai').hidden=true}
async function runAI(){
  const topic=$('#aiPrompt').value.trim();if(!topic){aiErr('Describe what the presentation is about.');$('#aiPrompt').focus();return}
  aiErr('');const prompt=aiPrompt();aiCtl=new AbortController();
  try{
    const smp=await getSample();let text;
    if(smp){
      aiBusyUI(true,'Asking Claude…');
      const r=await smp(prompt,{signal:aiCtl.signal,onText:({text})=>{$('#aiState').textContent=`Writing… ${text.length} characters`}});text=r.text;
    }else{
      const key=($('#aiKey')?.value||'').trim(),model=($('#aiModel')?.value||'').trim()||'claude-sonnet-5-5';
      if(!key){aiErr('Add an API key, or use the copy and paste option below.');return}
      aiCfg={key,model,remember:$('#aiRemember').checked};
      tryDo(()=>aiCfg.remember?localStorage.setItem(AI_LS,JSON.stringify({key,model})):localStorage.removeItem(AI_LS));
      aiBusyUI(true,'Asking Claude…');
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:aiCtl.signal,
        headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model,max_tokens:8000,messages:[{role:'user',content:prompt}]})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw new Error(data?.error?.message||`Request failed (${res.status}).`);
      text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    }
    applyAi(text);aiBusyUI(false);$('#ai').hidden=true;
  }catch(e){
    aiBusyUI(false);
    if(e&&(e.name==='AbortError'||e.code==='aborted'))return;
    aiErr(e&&e.code==='not_granted'?'Generation was not allowed for this page.':e&&e.code==='rate_limited'?'Too many requests. Wait a moment and try again.':(e&&e.message)||'Something went wrong. Try again.');
  }
}
$('#aiBtn').onclick=()=>{endEdit();openAI()};
$('#newAiBtn').onclick=async()=>{const d=newDeck();await store.put(d);openDeck(d);openAI({replace:true})};
$('#aiGo').onclick=runAI;$('#aiX').onclick=$('#aiCancel').onclick=closeAI;
$('#ai').addEventListener('pointerdown',e=>{if(e.target===e.currentTarget&&!aiBusy)closeAI()});
['aiPrompt','aiCount','aiTone','aiNotes'].forEach(id=>$('#'+id).addEventListener('input',()=>{$('#aiPromptOut').value=aiPrompt()}));
$('#aiPrompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runAI()}});
$('#aiCopy').onclick=async()=>{const t=$('#aiPromptOut');try{await navigator.clipboard.writeText(t.value);toast('Prompt copied')}catch(e){t.select();toast('Press Ctrl+C to copy the selected prompt')}};
$('#aiApply').onclick=()=>{try{aiErr('');applyAi($('#aiPaste').value);$('#aiPaste').value='';$('#ai').hidden=true}catch(e){aiErr(e.message)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ai').hidden){e.preventDefault();e.stopPropagation();closeAI()}},true);

/* ---------- boot ---------- */
(async()=>{
  paintIcons();
  await store.init();
  let decks=await store.all();
  const seeded=tryDo(()=>localStorage.getItem('deckhand.seeded'),null);
  if(!decks.length&&!seeded){await store.put(sampleDeck());tryDo(()=>localStorage.setItem('deckhand.seeded','1'))}
  showHome();
  window.__deckhand={aiSlides,applyAi,get deck(){return deck},store,sanitizeDeck,buildPDF,exportPDF};
})();
})();
</script>
